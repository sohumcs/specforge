# Weekly, grouped update PRs. Every PR must pass the full CI gate before merge.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    # torch is installed from the CPU wheel index at a pinned version (Dockerfile + CI);
    # bump TORCH_VERSION deliberately, not through the PyPI lock.
    ignore:
      - dependency-name: torch

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Held back on purpose (ADR-031): typescript-eslint needs TS < 6.1,
      # eslint-plugin-jsx-a11y needs ESLint <= 9.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]

  # Keeps the SHA-pinned actions current (the pin comment shows the tag).
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly, day: monday }
