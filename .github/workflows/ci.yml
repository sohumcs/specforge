# Pull-request gate (and the same checks on every push to main).
#
# Security notes
# * Every third-party action is pinned to a full commit SHA (with the tag in a
#   comment). In March 2026 aquasecurity/trivy-action had 75+ tags force-pushed
#   to a credential stealer; SHA pins were the protection that held. Dependabot
#   (github-actions ecosystem) bumps these SHAs via reviewed PRs.
# * The workflow token is read-only; no job needs write access.
# * The Trivy *scanner* binary is pinned too (v0.76.2, an immutable release
#   published after the incident) instead of "latest".

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  TORCH_VERSION: "2.15.0"
  TRIVY_VERSION: "v0.76.2"

jobs:
  backend:
    name: Backend (ruff, mypy, bandit, pytest, coverage gate, pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: specforge
          POSTGRES_PASSWORD: specforge
          POSTGRES_DB: specforge
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U specforge" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install dependencies (CPU torch + pinned lock)
        run: |
          python -m pip install --upgrade pip
          pip install "torch==${TORCH_VERSION}" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.lock
      - name: Cache Hugging Face models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-l6-v2+nli-deberta-v3-xsmall-v1
      - name: Lint (ruff)
        run: |
          ruff check app tests scripts
          ruff format --check app tests scripts
      - name: Types (mypy --strict)
        run: mypy app
      - name: SAST (bandit)
        run: bandit -r app -q
      - name: Migrations apply cleanly and match the models
        env:
          DATABASE_URL: postgresql+psycopg://specforge:specforge@localhost:5433/specforge
        run: |
          alembic upgrade head
          alembic check
      - name: Tests (pytest + coverage)
        run: pytest --cov=app --cov-report=term-missing:skip-covered --cov-report=xml --cov-report=json
      - name: Coverage gate (>= 80% on each core module)
        run: python scripts/coverage_gate.py coverage.json --min 80
      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --progress-spinner off
          echo "torch==${TORCH_VERSION}" > /tmp/torch.txt
          pip-audit -r /tmp/torch.txt --progress-spinner off
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (eslint, tsc, vitest, npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint (eslint + jsx-a11y)
        run: npm run lint
      - name: Types (tsc)
        run: npm run typecheck
      - name: Unit tests (vitest)
        run: npm test
      - name: Dependency audit (npm audit)
        run: npm audit --audit-level=high
      - name: Production build
        run: npm run build

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    name: Image build + Trivy (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space (torch image layers are large)
        if: matrix.image == 'backend'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          load: true
          tags: specforge-${{ matrix.image == 'frontend' && 'web' || 'backend' }}:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Trivy (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: specforge-${{ matrix.image == 'frontend' && 'web' || 'backend' }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  e2e:
    name: E2E (Playwright vs docker compose)
    needs: images # reuses its warm build cache
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LLM_PROVIDERS: '["demo"]'
      GENERATE_LIMIT_PER_IP_HOUR: "1000"
      GENERATE_LIMIT_PER_USER_HOUR: "1000"
      DEMO_LOGIN_LIMIT_PER_IP_HOUR: "1000"
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend image (from cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          load: true
          tags: specforge-backend:dev
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend
      - name: Build web image (from cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          load: true
          tags: specforge-web:dev
          cache-from: type=gha,scope=frontend
      - name: Start the stack
        run: |
          docker compose up -d --no-build
          for _ in $(seq 1 90); do curl -fsS http://localhost:8080/ready && exit 0; sleep 2; done
          docker compose ps; docker compose logs --tail=80; exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:8080
        run: npx playwright test
      - name: Smoke test (API-level flow)
        run: |
          python3 -m pip install --quiet httpx
          python3 backend/scripts/e2e_smoke.py http://localhost:8080
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14
